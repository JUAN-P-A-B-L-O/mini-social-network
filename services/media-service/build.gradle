plugins {
    id 'java'
    id 'application'
}

group = 'com.intersocial'
version = '0.1.0'

repositories { mavenCentral() }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
application { mainClass = 'com.intersocial.media.Application' }

dependencies {
    annotationProcessor platform('io.micronaut.platform:micronaut-platform:4.10.24')
    annotationProcessor 'io.micronaut:micronaut-inject-java'
    annotationProcessor 'io.micronaut.data:micronaut-data-processor'
    annotationProcessor 'io.micronaut.validation:micronaut-validation-processor'
    annotationProcessor 'io.micronaut:micronaut-http-validation'
    implementation platform('io.micronaut.platform:micronaut-platform:4.10.24')
    implementation 'io.micronaut:micronaut-http-server-netty'
    implementation 'io.micronaut:micronaut-jackson-databind'
    implementation 'io.micronaut:micronaut-management'
    implementation 'io.micronaut.data:micronaut-data-jdbc'
    implementation 'io.micronaut.sql:micronaut-jdbc-hikari'
    implementation 'io.micronaut.flyway:micronaut-flyway'
    implementation 'io.micronaut.validation:micronaut-validation'
    runtimeOnly 'ch.qos.logback:logback-classic'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    testImplementation enforcedPlatform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
}

test { useJUnitPlatform() }
