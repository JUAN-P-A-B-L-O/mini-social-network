micronaut.application.name=media-service
micronaut.server.host=${SERVER_HOST:127.0.0.1}
micronaut.server.port=${SERVER_PORT:8082}
datasources.default.url=${JDBC_URL}
datasources.default.username=${DB_USER}
datasources.default.password=${DB_PASSWORD}
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.dialect=POSTGRES
datasources.default.maximum-pool-size=${DB_POOL_SIZE:5}
flyway.datasources.default.enabled=true
endpoints.health.enabled=true
endpoints.health.sensitive=false
endpoints.health.details-visible=NEVER
media.s3.region=${AWS_REGION:}
media.s3.bucket=${MEDIA_S3_BUCKET:}
media.upload.max-bytes=${MEDIA_UPLOAD_MAX_BYTES:10485760}
